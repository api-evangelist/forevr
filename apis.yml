name: ForeVR
description: 'ForeVR Games is a consumer virtual-reality game studio that brings classic
  social bar and backyard games into VR. Its catalog includes ForeVR Bowl, ForeVR Darts,
  ForeVR Pool, and ForeVR Cornhole, built for multiplayer play across Meta Quest, Steam
  VR, and PlayStation VR2. The company was surfaced as a portfolio company of bessemer-venture-partners
  and added to the API Evangelist network. ForeVR is a consumer game publisher with no
  public developer API, SDK, or documentation program; this profile captures its public
  identity and domain-security posture rather than an API surface.'
